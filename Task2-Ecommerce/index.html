<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-commerce Product</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Product Image -->
    <div class="image-section">
        <img src="headset.webp" alt="Product">
    </div>

    <!-- Product Details -->
    <div class="details-section">
        <h1>Wireless Headphones</h1>

        <div class="rating">⭐⭐⭐⭐☆ (4.2)</div>

        <p class="price">₹1999 <span class="old-price">₹2999</span></p>

        <p class="description">
            High-quality wireless headphones with noise cancellation and long battery life.
        </p>

        <!-- Quantity -->
        <div class="quantity">
            <button onclick="decrease()">-</button>
            <span id="qty">1</span>
            <button onclick="increase()">+</button>
        </div>

        <!-- Buttons -->
        <button class="cart" onclick="addToCart()">Add to Cart</button>
        <button class="buy">Buy Now</button>
        <button class="wishlist" onclick="wishlist()">❤️</button>
    </div>

</div>

<script src="script.js"></script>
</div>
</body>
</html>
